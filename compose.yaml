# Local development services. Start with `pnpm db:up`, stop with `pnpm db:down`.
# The apps themselves run on your machine with `pnpm dev`.
name: downloader

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-downloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-downloader}
      POSTGRES_DB: ${POSTGRES_DB:-downloader}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
