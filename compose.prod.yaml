# Full stack in containers (production-like). Run with `pnpm docker:up`.
# Requires a .env file in the repo root (see .env.example), with a strong POSTGRES_PASSWORD.
name: downloader-prod

x-database-url: &database-url postgres://${POSTGRES_USER:-downloader}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-downloader}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-downloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-downloader}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: applies database migrations, then exits. The server waits for it.
  migrate:
    image: downloader-server
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["node", "node_modules/@downloader/db/dist/migrate-cli.js"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: downloader-server
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"

  web:
    image: downloader-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://server:4000
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
